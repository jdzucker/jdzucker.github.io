name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://jdzucker.github.io
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/img _site/en _site/zh
          cp index.html style.css script.js favicon.svg _site/
          cp static/citation_data.json _site/
          cp recent_pubs.json _site/
          cp img/* _site/img/ 2>/dev/null || true
          [ -f en/index.html ] && cp en/index.html _site/en/ || true
          [ -f zh/index.html ] && cp zh/index.html _site/zh/ || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
