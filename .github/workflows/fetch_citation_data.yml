name: Fetch Citation Data

on:
  schedule:
    - cron: "0 3 * * 0"  # Every Sunday at 03:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch Scholar data
        run: python assets/scripts/fetch_citation_data.py

      - name: Move output to static/
        run: |
          [ -f citation_data.json ] && mv citation_data.json static/citation_data.json || true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/citation_data.json
          git diff --cached --quiet || git commit -m "chore: update citation data [skip ci]"
          git push
